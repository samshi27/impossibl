<div class="dashboard-header">
  <h1>Posts</h1>
  <button type="button" class="primary-button" [routerLink]="['/admin/create']">New Post</button>
</div>

<div class="dashboard-grid">
  @for (post of posts(); track post.id) {
    <div class="post-row">
      <span class="post-row-title">{{ post.title }}</span>
      <span class="status status-{{ post.status }}">{{ post.status }}</span>
      <button type="button" class="primary-button" [routerLink]="['/admin/edit', post.slug]">
        Edit
      </button>
    </div>
  } @empty {
    <p>No posts yet.</p>
  }
</div>
